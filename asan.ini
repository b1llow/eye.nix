[binaries]
c = 'clang'
cpp = 'clang++'

[built-in options]
buildtype = 'debugoptimized'
b_sanitize = 'address,undefined'
b_lto = false
b_lundef = false
c_args = ['-fno-omit-frame-pointer', '-fno-sanitize=function', '-finstrument-functions']
cpp_args = ['-fno-omit-frame-pointer', '-fno-sanitize=function', '-finstrument-functions']
