[binaries]
c = 'clang'
cpp = 'clang++'

[built-in options]
buildtype = 'debug'
b_sanitize = 'leak'
b_lto = false
b_lundef = false
c_args = ['-fno-omit-frame-pointer', '-fno-sanitize=function', '-ftrivial-auto-var-init=pattern', '-funsigned-char']
cpp_args = ['-fno-omit-frame-pointer', '-fno-sanitize=function', '-ftrivial-auto-var-init=pattern', '-funsigned-char']
